<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher AI - Admin</title>
<style>
  :root { --bg:#faf6ef; --card:#fff; --ink:#1d2a2a; --mute:#66706f; --brand:#0f766e; --line:#e3dccd; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b19; --card:#27251f; --ink:#f1ece2; --mute:#a9a597; --brand:#2dd4bf; --line:#3a372e; --err:#ff8a7a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, Segoe UI, Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size:1.4rem; margin:8px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  label { display:block; font-size:.85rem; color:var(--mute); margin:10px 0 3px; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; }
  @media (max-width:640px) { .row { grid-template-columns: 1fr; } }
  button { background:var(--brand); color:#fff; border:0; padding:10px 16px; border-radius:8px; font:inherit; cursor:pointer; margin-top:12px; margin-right:8px; }
  @media (prefers-color-scheme: dark) { button { color:#06231f; } }
  .msg { margin-top:10px; font-size:.9rem; } .err { color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; display:block; overflow-x:auto; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .stat { display:inline-block; margin:0 18px 8px 0; } .stat b { display:block; font-size:1.3rem; }
</style>
</head>
<body>
<main>
  <h1>Teacher AI - Admin</h1>
  <div class="card">
    <label>Admin key</label><input id="key" type="password" placeholder="The ADMIN_KEY you set">
    <button id="btnStats">Load stats and users</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card"><h2>Stats</h2><div id="stats">Not loaded yet.</div></div>
  <div class="card">
    <h2>Give a user a paid plan (or set back to free)</h2>
    <div class="row">
      <div><label>Their email or phone</label><input id="pIdent"></div>
      <div><label>Plan</label><select id="pPlan"><option>monthly</option><option>term</option><option>free</option></select></div>
      <div><label>Days to add</label><input id="pDays" value="30"></div>
    </div>
    <button id="btnPlan">Save plan</button>
  </div>
  <div class="card">
    <h2>Reset a user's password</h2>
    <div class="row">
      <div><label>Their email or phone</label><input id="rIdent"></div>
      <div><label>New password (8+ characters)</label><input id="rPw"></div>
      <div></div>
    </div>
    <button id="btnReset">Reset password</button>
  </div>
  <div class="card">
    <h2>Delete a user's account (for emailed requests)</h2>
    <p style="color:var(--mute);font-size:.9rem;margin:0">Removes the account, library, classes and scores for good. Check that the request really came from the account owner first.</p>
    <div class="row">
      <div><label>Their email or phone</label><input id="xIdent"></div>
      <div><label>Type DELETE to confirm</label><input id="xOk" autocomplete="off"></div>
      <div></div>
    </div>
    <button class="btn-danger" id="btnDel" style="background:#b42318;color:#fff">Delete this account</button>
  </div>
  <div class="card">
    <h2>Users</h2>
    <label>Search by name, email or phone (optional)</label><input id="q">
    <button id="btnUsers">Search</button>
    <div id="users"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': $('key').value }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function msg(t, err) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
async function loadStats() {
  const s = await api('GET', '/api/admin/stats');
  $('stats').innerHTML = [['Users', s.users], ['New (7 days)', s.newUsersLast7Days], ['Paid now', s.paidUsersNow], ['Generations today', s.generationsToday], ['Generations (7 days)', s.generationsLast7Days], ['Input tokens (7d)', s.inputTokensLast7Days], ['Output tokens (7d)', s.outputTokensLast7Days], ['AI mode', s.aiMode]]
    .map((x) => '<span class="stat"><b>' + esc(x[1]) + '</b>' + esc(x[0]) + '</span>').join('');
}
async function loadUsers() {
  const r = await api('GET', '/api/admin/users?limit=100&q=' + encodeURIComponent($('q').value));
  $('users').innerHTML = '<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Plan</th><th>Expires</th><th>Used today</th><th>Joined</th></tr>' +
    r.users.map((u) => '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.email) + '</td><td>' + esc(u.phone) + '</td><td>' + esc(u.plan) + '</td><td>' + (u.planExpiresAt ? new Date(u.planExpiresAt).toLocaleDateString() : '') + '</td><td>' + u.usedToday + '</td><td>' + new Date(u.createdAt).toLocaleDateString() + '</td></tr>').join('') + '</table>';
}
$('btnStats').onclick = async () => { msg('Loading...'); try { await loadStats(); await loadUsers(); msg(''); } catch (e) { msg(e.message, true); } };
$('btnUsers').onclick = async () => { try { await loadUsers(); msg(''); } catch (e) { msg(e.message, true); } };
$('btnPlan').onclick = async () => { try { const r = await api('POST', '/api/admin/set-plan', { identifier: $('pIdent').value, plan: $('pPlan').value, days: Number($('pDays').value) }); msg('Saved: ' + r.user.name + ' is now on the ' + r.user.plan + ' plan' + (r.user.planExpiresAt ? ' until ' + new Date(r.user.planExpiresAt).toLocaleDateString() : '') + '.'); await loadUsers(); } catch (e) { msg(e.message, true); } };
$('btnDel').onclick = async () => { try { if ($('xOk').value.trim() !== 'DELETE') throw new Error('Type DELETE in the box to confirm.'); await api('POST', '/api/admin/delete-user', { identifier: $('xIdent').value }); msg('Account deleted.'); $('xIdent').value = ''; $('xOk').value = ''; await loadUsers(); } catch (e) { msg(e.message, true); } };
$('btnReset').onclick = async () => { try { await api('POST', '/api/admin/reset-password', { identifier: $('rIdent').value, newPassword: $('rPw').value }); msg('Password reset. Tell the teacher the new password.'); $('rPw').value = ''; } catch (e) { msg(e.message, true); } };
</script>
</body>
</html>
