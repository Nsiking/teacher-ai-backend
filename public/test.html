<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartClass Teacher AI - Test Page</title>
<style>
  :root { --bg:#faf6ef; --card:#fff; --ink:#1d2a2a; --mute:#66706f; --brand:#0f766e; --line:#e3dccd; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b19; --card:#27251f; --ink:#f1ece2; --mute:#a9a597; --brand:#2dd4bf; --line:#3a372e; --err:#ff8a7a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, Segoe UI, Arial, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; }
  .sub { color:var(--mute); margin:0 0 16px; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  label { display:block; font-size:.85rem; color:var(--mute); margin:10px 0 3px; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height: 90px; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width:560px) { .row { grid-template-columns: 1fr; } }
  button { background:var(--brand); color:#fff; border:0; padding:10px 16px; border-radius:8px; font:inherit; cursor:pointer; margin-top:12px; margin-right:8px; }
  @media (prefers-color-scheme: dark) { button { color:#06231f; } }
  button.alt { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button:disabled { opacity:.5; cursor:wait; }
  .msg { margin-top:10px; font-size:.9rem; }
  .err { color:var(--err); }
  .out { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size:.85rem; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; max-height:520px; overflow:auto; }
  .hide { display:none; }
  .pill { display:inline-block; background:var(--bg); border:1px solid var(--line); padding:2px 10px; border-radius:999px; font-size:.8rem; margin-right:6px; }
  .lib-item { padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>SmartClass Teacher AI</h1>
  <p class="sub">Test page for the backend. The real Android app will do the same things.</p>

  <div class="card" id="authCard">
    <h2>1. Create account or log in</h2>
    <label>Full name (only for sign up)</label><input id="name" placeholder="e.g. Mrs Adaeze Obi">
    <div class="row">
      <div><label>Email or phone number</label><input id="ident" placeholder="08012345678 or you@email.com"></div>
      <div><label>Password (8+ characters)</label><input id="pw" type="password"></div>
    </div>
    <button id="btnSignup">Sign up</button><button class="alt" id="btnLogin">Log in</button>
    <div class="msg" id="authMsg"></div>
  </div>

  <div class="card hide" id="appCard">
    <div><span class="pill" id="who"></span><span class="pill" id="usage"></span><button class="alt" id="btnLogout" style="margin:0">Log out</button></div>
  </div>

  <div class="card hide" id="genCard">
    <h2>2. Generate</h2>
    <label>What do you want?</label>
    <select id="kind">
      <option value="lesson-note">Lesson note</option>
      <option value="questions">Questions (test / exam)</option>
      <option value="worksheet">Worksheet</option>
      <option value="report-comments">Report card comments</option>
    </select>
    <div class="row">
      <div id="fSubject"><label>Subject</label><input id="subject" placeholder="e.g. Mathematics"></div>
      <div><label>Class</label><select id="className"></select></div>
    </div>
    <div id="fTopic"><label>Topic</label><input id="topic" placeholder="e.g. Algebraic expressions"></div>

    <div id="xLesson">
      <div class="row">
        <div><label>Term</label><select id="term"></select></div>
        <div><label>Week</label><input id="week" placeholder="e.g. Week 3"></div>
      </div>
      <label>Duration (minutes)</label><input id="duration" value="40">
    </div>
    <div id="xQuestions" class="hide">
      <div class="row">
        <div><label>Type</label><select id="qtype"><option>mixed</option><option>objective</option><option>theory</option></select></div>
        <div><label>Difficulty</label><select id="difficulty"><option>mixed</option><option>easy</option><option>medium</option><option>hard</option></select></div>
      </div>
      <div class="row">
        <div><label>Objective questions</label><input id="objN" value="10"></div>
        <div><label>Theory questions</label><input id="thN" value="3"></div>
      </div>
    </div>
    <div id="xWorksheet" class="hide"><label>Number of activities</label><input id="actN" value="10"></div>
    <div id="xComments" class="hide">
      <div class="row">
        <div><label>Term</label><select id="cterm"></select></div>
        <div><label>Tone</label><select id="tone"><option>encouraging</option><option>balanced</option><option>firm</option></select></div>
      </div>
      <label>Pupils: one per line as  Name | boy or girl | scores | notes</label>
      <textarea id="pupils" placeholder="Chidi Obi | boy | Maths 80, English 55 | talkative&#10;Amina Bello | girl | Maths 62, English 78 | very neat"></textarea>
    </div>
    <label>Extra requests (optional)</label><input id="extras" placeholder="e.g. include group work">
    <button id="btnGen">Generate</button><button class="alt" id="btnLib">My library</button>
    <div class="msg" id="genMsg"></div>
    <div class="out hide" id="out"></div>
    <button class="alt hide" id="btnCopy">Copy text</button>
    <div id="lib"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('tt_token') || '';

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong.'); e.code = j.code; e.status = r.status; throw e; }
  return j;
}
function setMsg(el, text, isErr) { el.textContent = text || ''; el.className = 'msg' + (isErr ? ' err' : ''); }
function showLoggedIn(s) {
  token = s.token || token; localStorage.setItem('tt_token', token);
  $('authCard').classList.add('hide'); $('appCard').classList.remove('hide'); $('genCard').classList.remove('hide');
  $('who').textContent = s.user.name + ' (' + s.user.plan + ' plan)';
  setUsage(s.usage);
}
function setUsage(u) { $('usage').textContent = 'Used today: ' + u.used + ' of ' + u.limit; }

async function auth(path, body) {
  setMsg($('authMsg'), 'Please wait...');
  try { const s = await api('POST', path, body); setMsg($('authMsg'), ''); showLoggedIn(s); }
  catch (e) { setMsg($('authMsg'), e.message, true); }
}
function creds() {
  const ident = $('ident').value.trim();
  return { ident, pw: $('pw').value };
}
$('btnSignup').onclick = () => {
  const c = creds(); const b = { name: $('name').value, password: c.pw };
  if (c.ident.includes('@')) b.email = c.ident; else b.phone = c.ident;
  auth('/api/auth/signup', b);
};
$('btnLogin').onclick = () => { const c = creds(); auth('/api/auth/login', { identifier: c.ident, password: c.pw }); };
$('btnLogout').onclick = () => { token = ''; localStorage.removeItem('tt_token'); location.reload(); };

async function init() {
  const meta = await api('GET', '/api/meta');
  $('className').innerHTML = meta.classes.map((c) => '<option>' + c + '</option>').join('');
  $('className').value = 'JSS 1';
  const terms = meta.terms.map((t) => '<option>' + t + '</option>').join('');
  $('term').innerHTML = terms; $('cterm').innerHTML = terms;
  if (token) { try { const me = await api('GET', '/api/me'); showLoggedIn({ user: me.user, usage: me.usage }); } catch (e) { token = ''; localStorage.removeItem('tt_token'); } }
}
$('kind').onchange = () => {
  const k = $('kind').value;
  $('xLesson').classList.toggle('hide', k !== 'lesson-note');
  $('xQuestions').classList.toggle('hide', k !== 'questions');
  $('xWorksheet').classList.toggle('hide', k !== 'worksheet');
  $('xComments').classList.toggle('hide', k !== 'report-comments');
  $('fSubject').classList.toggle('hide', k === 'report-comments');
  $('fTopic').classList.toggle('hide', k === 'report-comments');
};

$('btnGen').onclick = async () => {
  const k = $('kind').value; let body;
  if (k === 'lesson-note') body = { subject: $('subject').value, className: $('className').value, topic: $('topic').value, term: $('term').value, week: $('week').value, duration: $('duration').value, extras: $('extras').value };
  else if (k === 'questions') body = { subject: $('subject').value, className: $('className').value, topic: $('topic').value, type: $('qtype').value, difficulty: $('difficulty').value, objectiveCount: $('objN').value, theoryCount: $('thN').value, extras: $('extras').value };
  else if (k === 'worksheet') body = { subject: $('subject').value, className: $('className').value, topic: $('topic').value, activityCount: $('actN').value, extras: $('extras').value };
  else {
    const pupils = $('pupils').value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const p = l.split('|').map((x) => x.trim()); return { name: p[0], gender: p[1] || '', scores: p[2] || '', notes: p[3] || '' }; });
    body = { className: $('className').value, term: $('cterm').value, tone: $('tone').value, pupils };
  }
  $('btnGen').disabled = true; setMsg($('genMsg'), 'Working... this can take up to a minute.'); $('out').classList.add('hide'); $('btnCopy').classList.add('hide');
  try {
    const r = await api('POST', '/api/generate/' + k, body);
    setMsg($('genMsg'), r.truncated ? 'Done (the answer may be cut short; try fewer items).' : 'Done. Saved to your library.');
    $('out').textContent = r.content; $('out').classList.remove('hide'); $('btnCopy').classList.remove('hide'); setUsage(r.usage);
  } catch (e) { setMsg($('genMsg'), e.message, true); }
  $('btnGen').disabled = false;
};
$('btnCopy').onclick = async () => { try { await navigator.clipboard.writeText($('out').textContent); setMsg($('genMsg'), 'Copied.'); } catch (e) { setMsg($('genMsg'), 'Copy failed. Select the text and copy it.', true); } };
$('btnLib').onclick = async () => {
  try {
    const r = await api('GET', '/api/library');
    $('lib').innerHTML = r.items.length ? '' : '<p class="sub">Nothing saved yet.</p>';
    r.items.forEach((it) => {
      const d = document.createElement('div'); d.className = 'lib-item';
      d.textContent = it.title + '  (' + new Date(it.createdAt).toLocaleString() + ')';
      d.onclick = async () => { const f = await api('GET', '/api/library/' + it.id); $('out').textContent = f.content; $('out').classList.remove('hide'); $('btnCopy').classList.remove('hide'); window.scrollTo(0, document.body.scrollHeight); };
      $('lib').appendChild(d);
    });
  } catch (e) { setMsg($('genMsg'), e.message, true); }
};
init();
</script>
</body>
</html>
